<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votre avis</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#1f2937;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:520px;margin:0 auto;padding:22px 18px 40px}
h1{font-size:26px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:#6b7280;margin:0 0 22px;font-size:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.st{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.st button{border:0;background:none;font-size:46px;line-height:1;cursor:pointer;color:#d1d5db;padding:2px;-webkit-tap-highlight-color:transparent}
.st button.on{color:#f59e0b}
.lab{text-align:center;color:#6b7280;min-height:22px;margin-bottom:12px;font-size:16px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
textarea,input{width:100%;font:inherit;font-size:17px;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff;color:inherit}
textarea{min-height:120px;resize:vertical}
button.go{width:100%;margin-top:18px;border:0;border-radius:14px;background:#15803d;color:#fff;font-size:19px;font-weight:700;padding:16px;cursor:pointer}
button.go:disabled{opacity:.5}
.ok{text-align:center;padding:30px 10px}
.ok .big{font-size:64px}
.err{color:#dc2626;text-align:center;margin-top:12px}
.meta{color:#9ca3af;font-size:13px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="w">
  <h1 id="nom">Votre avis</h1>
  <p class="sub">Merci de prendre un moment pour nous laisser votre avis.</p>
  <div class="card" id="form">
    <div class="st" id="st"></div>
    <div class="lab" id="lab">Touchez les étoiles pour donner une note</div>
    <label for="txt">Votre commentaire</label>
    <textarea id="txt" autocomplete="off" maxlength="1500" placeholder="Qu'avez-vous aimé ? Que pouvons-nous améliorer ?"></textarea>
    <label for="who">Votre prénom <span style="font-weight:400;color:#9ca3af">(facultatif)</span></label>
    <input id="who" name="sig_x" maxlength="60" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" placeholder="Laisser vide pour rester anonyme">
    <button class="go" id="go" disabled>Envoyer mon avis</button>
    <div class="err" id="err"></div>
  </div>
  <div class="card ok" id="merci" style="display:none"><div class="big">🙏</div><h2>Merci beaucoup !</h2><p>Votre avis a bien été envoyé.</p></div>
  <p class="meta">Votre avis est envoyé de façon chiffrée, seul l'établissement peut le lire.</p>
</div>
<script>
const BOXURL='https://explordinateur-plan-nettoyage-avis.hf.space/api/b/';
const P=new URLSearchParams(location.hash.slice(1));const B=P.get('b'),K=P.get('k'),N=P.get('n');
if(N){document.getElementById('nom').textContent=N;document.title='Votre avis — '+N}
const LBL=['','Très déçu','Déçu','Correct','Très bien','Excellent !'];let note=0;
const st=document.getElementById('st');for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.setAttribute('aria-label',i+' étoile'+(i>1?'s':''));b.onclick=()=>{note=i;draw()};st.appendChild(b)}
function draw(){[...st.children].forEach((b,i)=>b.classList.toggle('on',i<note));document.getElementById('lab').textContent=note?LBL[note]:'Touchez les étoiles pour donner une note';document.getElementById('go').disabled=!note}
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
async function seal(obj){const pub=await crypto.subtle.importKey('raw',ub64(K),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:pub},eph.privateKey,{name:'AES-GCM',length:256},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({e:b64u(await crypto.subtle.exportKey('raw',eph.publicKey)),i:b64u(iv),c:b64u(ct)})}
if(!B||!K||!window.crypto||!crypto.subtle){document.getElementById('err').textContent=!B||!K?'Lien incomplet : scannez de nouveau le QR code.':'Ce navigateur est trop ancien.';document.getElementById('go').style.display='none'}
document.getElementById('go').onclick=async()=>{const g=document.getElementById('go'),e=document.getElementById('err');e.textContent='';if(!note)return;g.disabled=true;g.textContent='Envoi…';
  try{const d=await seal({note,txt:document.getElementById('txt').value.trim().slice(0,1500),nom:document.getElementById('who').value.trim().slice(0,60),ts:Date.now()});
    const r=await fetch(BOXURL+encodeURIComponent(B)+'/avis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({d})});
    if(r.status===429)throw new Error('Trop d\'envois, réessayez plus tard.');if(!r.ok)throw new Error('Envoi impossible ('+r.status+'), réessayez dans un instant.');
    document.getElementById('form').style.display='none';document.getElementById('merci').style.display='block'}
  catch(x){e.textContent=x.message||'Envoi impossible, vérifiez la connexion.';g.disabled=false;g.textContent='Envoyer mon avis'}};
draw();
setTimeout(()=>{const w=document.getElementById('who');if(w&&!w.matches(':focus'))w.value=''},300);setTimeout(()=>{const w=document.getElementById('who');if(w&&!w.matches(':focus'))w.value=''},1200);
</script>
</body>
</html>
