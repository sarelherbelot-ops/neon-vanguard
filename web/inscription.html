<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant — inscription</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.c{background:#fff;border-radius:16px;padding:24px;max-width:420px;margin:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
h1{font-size:20px}p{color:#4b5563}</style></head>
<body><div class="c"><h1>🧽 Préparation de l'appareil…</h1><p id="t">Effacement de l'ancien compte sur ce téléphone.</p></div>
<script>
(async()=>{
  const t=document.getElementById('t');
  try{localStorage.clear()}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  const del=n=>new Promise(r=>{try{const q=indexedDB.deleteDatabase(n);q.onsuccess=q.onerror=q.onblocked=()=>r()}catch(e){r()}});
  try{if(indexedDB.databases){for(const d of await indexedDB.databases())if(d.name)await del(d.name)}}catch(e){}
  await del('plan_nettoyage');
  try{if('caches' in window)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  t.textContent='✔ Appareil vidé. Ouverture de la connexion…';
  const acc=(location.hash.replace('#','')||'sarel').replace(/[^A-Za-z0-9_.-]/g,'');
  setTimeout(()=>location.replace('./?v='+Date.now()+'#inscription='+acc),900);
})();
</script></body></html>
